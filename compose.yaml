services:
  db-cycle-tests:
    build:
      context: game-backend
    env_file:
      - ./secrets/backend.env
    environment:
      CYCLE_TRIGGER_SQL_PATH: /db-init/016-install-cycle-triggers.sql
    depends_on:
      db:
        condition: service_healthy
    command: npm run test:db:cycles
    restart: "no"
    volumes:
      - ./db/init:/db-init:ro

  game-backend:
    build:
      context: game-backend
    env_file:
      - ./secrets/backend.env
    ports:
      - 3001:3001
    depends_on:
      db:
        condition: service_healthy
      db-cycle-tests:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 20s

  randomizer-backend:
    build:
      context: randomizer-backend
    env_file:
      - ./secrets/backend.env
    environment:
      PORT: 3003
    ports:
      - 3003:3003
    depends_on:
      db:
        condition: service_healthy
      db-cycle-tests:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health/live || exit 1"]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - 3002:80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      db-cycle-tests:
        condition: service_completed_successfully

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER_FILE: /run/secrets/postgres-superuser
      POSTGRES_DB_FILE: /run/secrets/postgres-db
    ports:
      - 5432:5432
    volumes:
      - db-volume:/var/lib/postgresql/data:rw
      - ./db/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres-password
      - postgres-superuser
      - postgres-db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$(cat /run/secrets/postgres-superuser)" -d "$(cat /run/secrets/postgres-db)" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

secrets:
  postgres-password:
    file: ./secrets/postgres-password.txt
  postgres-superuser:
    file: ./secrets/postgres-superuser.txt
  postgres-db:
    file: ./secrets/postgres-db.txt

volumes:
  db-volume:
