services:
  game-backend:
    build:
      context: game-backend
    env_file:
      - ./secrets/backend.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
    ports:
      - 3001:3001
    depends_on:
      - db
    volumes:
      - ./game-backend:/app
      - game-backend-node-modules:/app/node_modules

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
    ports:
      - 3002:3002
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER_FILE: /run/secrets/postgres-superuser
      POSTGRES_DB_FILE: /run/secrets/postgres-db
    ports:
      - 5432:5432
    volumes:
      - db-volume:/var/lib/postgresql/data:rw
      - ./db/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres-password
      - postgres-superuser
      - postgres-db

secrets:
  postgres-password:
    file: ./secrets/postgres-password.txt
  postgres-superuser:
    file: ./secrets/postgres-superuser.txt
  postgres-db:
    file: ./secrets/postgres-db.txt

volumes:
  db-volume:
  game-backend-node-modules:
  frontend-node-modules:
