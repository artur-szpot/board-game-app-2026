name: PR CI / Randomizer backend lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Randomizer backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: randomizer-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install randomizer backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run randomizer backend lint
        run: ruff check .
