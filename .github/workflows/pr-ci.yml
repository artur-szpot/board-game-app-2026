name: PR CI

on:
  pull_request:

jobs:
  game-backend:
    name: Game backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint -- --max-warnings=0

      - name: Run backend unit tests
        run: npm run test

      - name: Start backend app
        run: |
          npm run start > /tmp/game-backend-start.log 2>&1 &
          app_pid=$!
          ready=0

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/game-backend-start.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3001/health
          curl --fail --silent --show-error http://127.0.0.1:3001/health/live
          kill "$app_pid" >/dev/null 2>&1 || true

      - name: Build backend
        run: npm run build

  randomizer-backend:
    name: Randomizer backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: randomizer-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install randomizer backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run randomizer backend lint
        run: ruff check .

      - name: Run randomizer backend unit tests
        run: pytest

      - name: Start randomizer backend app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 3003 > /tmp/randomizer-backend-start.log 2>&1 &
          app_pid=$!
          ready=0

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3003/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/randomizer-backend-start.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3003/health
          curl --fail --silent --show-error http://127.0.0.1:3003/health/live
          kill "$app_pid" >/dev/null 2>&1 || true

      - name: Build randomizer backend image
        run: docker build -t randomizer-backend:ci .

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint -- --max-warnings=0

      - name: Run frontend type check
        run: npm run type-check

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
