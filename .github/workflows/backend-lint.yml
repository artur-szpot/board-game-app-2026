name: PR CI / Game backend lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Game backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint -- --max-warnings=0
